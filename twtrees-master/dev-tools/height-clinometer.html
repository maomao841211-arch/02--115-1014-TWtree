<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樹高測量(傾角三角法)</title>
<style>
  :root {
    --fg: #1b1b1b;
    --bg: #f5f7f2;
    --card: #ffffff;
    --accent: #2e7d32;
    --accent-dark: #1b5e20;
    --warn: #b71c1c;
    --line: #d9dcd4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 14px 40px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 8px 0 2px;
    text-align: center;
    color: var(--accent-dark);
  }
  header p {
    text-align: center;
    color: #555;
    margin: 0 0 14px;
    font-size: 0.95rem;
  }
  section.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .section-title {
    font-weight: bold;
    font-size: 1.05rem;
    margin: 0 0 10px;
    color: var(--accent-dark);
  }
  button {
    display: block;
    width: 100%;
    font-size: 1.1rem;
    padding: 14px 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button.secondary {
    background: #607d8b;
  }
  button.danger {
    background: var(--warn);
  }
  button:disabled {
    background: #b9bdb6;
    color: #eee;
    cursor: not-allowed;
  }
  button:active:not(:disabled) {
    filter: brightness(0.9);
  }
  .angle-display {
    text-align: center;
    font-size: 3rem;
    font-weight: bold;
    margin: 6px 0 10px;
    color: var(--accent-dark);
    letter-spacing: 1px;
  }
  .angle-caption {
    text-align: center;
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .raw-beta-caption {
    text-align: center;
    color: #999;
    font-size: 0.78rem;
    margin: -4px 0 6px;
  }
  .invert-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 8px 0 10px;
    background: #fafbf8;
  }
  .invert-row .invert-label {
    font-size: 0.95rem;
    color: #333;
  }
  .invert-row .invert-label small {
    display: block;
    color: #888;
    font-size: 0.78rem;
    margin-top: 2px;
  }
  /* 大顆好按的開關(checkbox 包 slider 樣式) */
  .switch {
    position: relative;
    display: inline-block;
    width: 56px;
    height: 32px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #b9bdb6;
    border-radius: 32px;
    transition: background-color 0.15s;
  }
  .switch .slider::before {
    position: absolute;
    content: "";
    height: 26px;
    width: 26px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    border-radius: 50%;
    transition: transform 0.15s;
  }
  .switch input:checked + .slider {
    background-color: var(--accent);
  }
  .switch input:checked + .slider::before {
    transform: translateX(24px);
  }
  .level-wrap {
    display: flex;
    justify-content: center;
    margin: 10px 0;
  }
  .level-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 3px solid #888;
    position: relative;
    background: repeating-linear-gradient(
      to bottom,
      #eef2ea 0px,
      #eef2ea 13px,
      #e2e7dc 13px,
      #e2e7dc 14px
    );
    overflow: hidden;
  }
  .level-line {
    position: absolute;
    top: 50%;
    left: -10%;
    width: 120%;
    height: 3px;
    background: #d32f2f;
    transform-origin: 50% 50%;
  }
  .level-center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: #1b1b1b;
  }
  .radio-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .radio-row label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
  }
  .radio-row input {
    width: 18px;
    height: 18px;
  }
  label.field-label {
    display: block;
    font-size: 0.95rem;
    margin-bottom: 4px;
    color: #444;
  }
  input[type="number"] {
    width: 100%;
    font-size: 1.2rem;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .capture-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .capture-value {
    text-align: center;
    font-size: 0.95rem;
    color: #333;
    margin: -2px 0 8px;
  }
  .capture-value b {
    font-size: 1.2rem;
    color: var(--accent-dark);
  }
  .result-box {
    background: #eef6ec;
    border: 1px solid #bcd8b8;
    border-radius: 10px;
    padding: 12px;
    margin-top: 8px;
  }
  .result-box .h-main {
    text-align: center;
    font-size: 2.2rem;
    font-weight: bold;
    color: var(--accent-dark);
    margin: 2px 0 6px;
  }
  .result-box .h-sub {
    text-align: center;
    font-size: 0.95rem;
    color: #444;
    margin: 2px 0;
  }
  .msg {
    font-size: 0.9rem;
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .msg.error {
    background: #fdecea;
    color: var(--warn);
    border: 1px solid #f5c6cb;
  }
  .msg.info {
    background: #eef2fb;
    color: #1a3a6b;
    border: 1px solid #c8d6ef;
  }
  video#camera-video {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    background: #000;
    display: block;
  }
  .camera-wrap {
    position: relative;
  }
  .camera-crosshair {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  .camera-crosshair::before,
  .camera-crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
  }
  .camera-crosshair::before {
    top: 50%; left: 10%; right: 10%; height: 2px; transform: translateY(-1px);
  }
  .camera-crosshair::after {
    left: 50%; top: 10%; bottom: 10%; width: 2px; transform: translateX(-1px);
  }
  footer {
    font-size: 0.8rem;
    color: #666;
    line-height: 1.5;
    padding: 6px 4px 0;
  }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>樹高測量(傾角三角法)</h1>
    <p>用手機傾角當測角器,量兩個角度、算出樹高。</p>
  </header>

  <!-- 相機取景(可選) -->
  <section class="card" id="camera-section">
    <div class="section-title">相機取景(可選)</div>
    <button id="btn-camera" type="button">開啟相機取景(輔助瞄準)</button>
    <div class="camera-wrap" id="camera-wrap" style="display:none;">
      <video id="camera-video" autoplay playsinline muted></video>
      <div class="camera-crosshair"></div>
    </div>
    <div id="camera-msg" class="msg info" style="display:none;"></div>
  </section>

  <!-- 感測器 -->
  <section class="card" id="sensor-section">
    <div class="section-title">傾角感測器</div>
    <button id="btn-enable-sensor" type="button">啟用感測器</button>
    <div id="sensor-error" class="msg error" style="display:none;"></div>

    <div class="angle-display" id="angle-display">—</div>
    <div class="angle-caption">目前仰角(往上為正、往下為負)</div>
    <div class="raw-beta-caption" id="raw-beta-display">原始 raw beta:—(debug 用)</div>

    <div class="level-wrap">
      <div class="level-circle">
        <div class="level-line" id="level-line"></div>
        <div class="level-center-dot"></div>
      </div>
    </div>

    <button id="btn-calibrate" class="secondary" type="button" disabled>對準水平線校正歸零</button>
    <div id="calibrate-msg" class="msg info" style="display:none;"></div>

    <div class="invert-row">
      <span class="invert-label">反轉角度方向
        <small>若往上傾時角度反而變小,勾選這個</small>
      </span>
      <label class="switch">
        <input type="checkbox" id="invert-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <!-- 模式選擇 -->
  <section class="card" id="mode-section">
    <div class="section-title">量測模式</div>
    <div class="radio-row">
      <label>
        <input type="radio" name="mode" id="mode-e" value="E" checked>
        模式 E(免量距離)
      </label>
      <label>
        <input type="radio" name="mode" id="mode-a" value="A">
        模式 A(已知距離)
      </label>
    </div>

    <div id="mode-e-inputs">
      <label class="field-label" for="input-h">眼睛/手機離地高度 h(公尺)</label>
      <input type="number" id="input-h" step="0.01" min="0" value="1.5">
    </div>

    <div id="mode-a-inputs" style="display:none;">
      <label class="field-label" for="input-d">已量到的水平距離 D(公尺)</label>
      <input type="number" id="input-d" step="0.01" min="0" placeholder="例如 10">
    </div>
  </section>

  <!-- 擷取角度 -->
  <section class="card" id="capture-section">
    <div class="section-title">擷取角度</div>
    <div class="capture-grid">
      <button id="btn-capture-base" type="button" disabled>擷取樹基角度</button>
      <button id="btn-capture-top" type="button" disabled>擷取樹頂角度</button>
    </div>
    <div class="capture-grid">
      <div class="capture-value">樹基角度:<br><b id="captured-base-display">未擷取</b></div>
      <div class="capture-value">樹頂角度:<br><b id="captured-top-display">未擷取</b></div>
    </div>
  </section>

  <!-- 計算 -->
  <section class="card" id="compute-section">
    <div class="section-title">計算樹高</div>
    <button id="btn-compute" type="button" disabled>計算樹高</button>
    <div id="compute-error" class="msg error" style="display:none;"></div>
    <div id="result-box" class="result-box" style="display:none;">
      <div class="h-main" id="result-h">-- m</div>
      <div class="h-sub" id="result-d"></div>
      <div class="h-sub" id="result-angles"></div>
    </div>
    <button id="btn-reset" class="danger" type="button">重設</button>
  </section>

  <footer>
    <p>校正/精度提示:站在離樹約一個樹高處、俯仰角落在 30–45° 之間最準;請在平地量測,且需能看到樹基。</p>
    <p>本工具為約估工具,非光達精度,典型誤差約 5–10%,僅供教學/測試/校正參考。</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
   * 感測器符號約定(重要,務必先讀):
   *
   * DeviceOrientationEvent.beta 是裝置前後翻轉角(pitch),不同裝置的
   * 零點與正負方向並不一致,無法在程式碼裡「猜對」所有手機。
   * 本工具採用下列約定並用「校正歸零」按鈕消除零點誤差:
   *
   *   1. 使用者手持手機呈直立姿勢(類似平常看手機螢幕的姿勢),
   *      沿手機頂邊(或背後鏡頭方向)瞄準目標。
   *   2. 在「對準水平線」的瞬間按下校正歸零,程式會把當下的
   *      raw beta 記錄為 zeroRef。
   *   3. 之後顯示的仰角 = SIGN * (raw beta − zeroRef)。
   *      多數手機在上述持機姿勢下,將手機頂端向後傾(瞄準更高處)
   *      會使 beta 增大,因此這裡取 SIGN = -1,讓「往上傾」對應
   *      「仰角變正」、「往下傾」對應「仰角變負」。
   *
   * 若實測時發現方向相反(往上傾角度反而變小/變負),代表你的裝置
   * 方向與本假設相反,請把下面的 SIGN 常數改成 +1。
   *
   * 因為使用者是拿著手機在戶外實測、無法臨場改程式碼,上面這個判斷
   * 交由畫面上的「反轉角度方向」開關即時處理:預設不勾 = SIGN=-1
   * (維持本檔案原始約定),勾選 = SIGN=+1,切換時立即生效、不需重載頁面。
   * ========================================================= */
  var SIGN = -1;

  var rawBeta = null;      // 最新一次感測器回報的原始 beta
  var zeroRef = 0;         // 校正歸零時記錄的 beta
  var sensorActive = false;

  var capturedBase = null; // 已擷取的樹基仰角(度)
  var capturedTop = null;  // 已擷取的樹頂仰角(度)

  // ---- DOM 參照 ----
  var el = {
    btnEnableSensor: document.getElementById("btn-enable-sensor"),
    sensorError: document.getElementById("sensor-error"),
    angleDisplay: document.getElementById("angle-display"),
    rawBetaDisplay: document.getElementById("raw-beta-display"),
    levelLine: document.getElementById("level-line"),
    btnCalibrate: document.getElementById("btn-calibrate"),
    calibrateMsg: document.getElementById("calibrate-msg"),
    invertToggle: document.getElementById("invert-toggle"),

    modeE: document.getElementById("mode-e"),
    modeA: document.getElementById("mode-a"),
    modeEInputs: document.getElementById("mode-e-inputs"),
    modeAInputs: document.getElementById("mode-a-inputs"),
    inputH: document.getElementById("input-h"),
    inputD: document.getElementById("input-d"),

    btnCaptureBase: document.getElementById("btn-capture-base"),
    btnCaptureTop: document.getElementById("btn-capture-top"),
    capturedBaseDisplay: document.getElementById("captured-base-display"),
    capturedTopDisplay: document.getElementById("captured-top-display"),

    btnCompute: document.getElementById("btn-compute"),
    computeError: document.getElementById("compute-error"),
    resultBox: document.getElementById("result-box"),
    resultH: document.getElementById("result-h"),
    resultD: document.getElementById("result-d"),
    resultAngles: document.getElementById("result-angles"),
    btnReset: document.getElementById("btn-reset"),

    btnCamera: document.getElementById("btn-camera"),
    cameraWrap: document.getElementById("camera-wrap"),
    cameraVideo: document.getElementById("camera-video"),
    cameraMsg: document.getElementById("camera-msg")
  };

  function deg2rad(d) { return (d * Math.PI) / 180; }

  function showMsg(node, text) {
    node.textContent = text;
    node.style.display = text ? "block" : "none";
  }

  // ---- 感測器角度計算 ----
  function currentAngle() {
    if (rawBeta === null) return null;
    return SIGN * (rawBeta - zeroRef);
  }

  function updateAngleDisplay() {
    var a = currentAngle();
    if (a === null || !isFinite(a)) {
      el.angleDisplay.textContent = "—";
      return;
    }
    el.angleDisplay.textContent = a.toFixed(1) + "°";
    // 水平氣泡視覺:把紅線依角度旋轉(限制在 -90~90 避免視覺失控)
    var clamped = Math.max(-90, Math.min(90, a));
    el.levelLine.style.transform = "translateY(-1.5px) rotate(" + (-clamped) + "deg)";
    updateRawBetaDisplay();
  }

  function updateRawBetaDisplay() {
    if (rawBeta === null) {
      el.rawBetaDisplay.textContent = "原始 raw beta:—(debug 用)";
      return;
    }
    el.rawBetaDisplay.textContent = "原始 raw beta:" + rawBeta.toFixed(1) + "°(debug 用)";
  }

  function handleOrientation(event) {
    if (typeof event.beta === "number" && isFinite(event.beta)) {
      rawBeta = event.beta;
      updateAngleDisplay();
      updateCaptureButtonsState();
    }
  }

  function updateCaptureButtonsState() {
    var ready = sensorActive && rawBeta !== null;
    el.btnCaptureBase.disabled = !ready;
    el.btnCaptureTop.disabled = !ready;
    el.btnCalibrate.disabled = !ready;
  }

  // ---- 啟用感測器(含 iOS 13+ 授權流程) ----
  el.btnEnableSensor.addEventListener("click", function () {
    requestSensorAccess();
  });

  function requestSensorAccess() {
    showMsg(el.sensorError, "");

    if (typeof DeviceOrientationEvent === "undefined") {
      showMsg(el.sensorError, "此裝置或瀏覽器不支援方向感測器,無法使用傾角量測功能。");
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      // iOS 13+ 需要使用者手勢觸發並 await 授權
      DeviceOrientationEvent.requestPermission()
        .then(function (state) {
          if (state === "granted") {
            attachSensor();
          } else {
            showMsg(
              el.sensorError,
              "感測器權限被拒絕。請確認本頁面以 HTTPS 開啟,並於 iOS 設定中允許動態與方向存取後重新整理再試一次。"
            );
          }
        })
        .catch(function (err) {
          showMsg(
            el.sensorError,
            "要求感測器權限失敗,請確認本頁面以 HTTPS 開啟後重新整理再試一次。(" +
              (err && err.message ? err.message : err) +
              ")"
          );
        });
    } else {
      // Android / 桌機:通常不需額外授權
      attachSensor();
    }
  }

  function attachSensor() {
    window.addEventListener("deviceorientation", handleOrientation);
    sensorActive = true;
    el.btnEnableSensor.style.display = "none";
    updateCaptureButtonsState();
  }

  // ---- 校正歸零 ----
  el.btnCalibrate.addEventListener("click", function () {
    if (rawBeta === null) return;
    zeroRef = rawBeta;
    updateAngleDisplay();
    showMsg(el.calibrateMsg, "已校正:目前顯示的仰角以此刻為水平線(0°)。");
  });

  // ---- 反轉角度方向開關(即時切換 SIGN,不需重載頁面) ----
  el.invertToggle.addEventListener("change", function () {
    SIGN = el.invertToggle.checked ? 1 : -1;
    updateAngleDisplay();
  });

  // ---- 模式切換 ----
  function updateModeUI() {
    var isE = el.modeE.checked;
    el.modeEInputs.style.display = isE ? "block" : "none";
    el.modeAInputs.style.display = isE ? "none" : "block";
    updateComputeButtonState();
  }
  el.modeE.addEventListener("change", updateModeUI);
  el.modeA.addEventListener("change", updateModeUI);

  // ---- 擷取角度 ----
  el.btnCaptureBase.addEventListener("click", function () {
    var a = currentAngle();
    if (a === null || !isFinite(a)) return;
    capturedBase = a;
    el.capturedBaseDisplay.textContent = a.toFixed(1) + "°";
    updateComputeButtonState();
  });

  el.btnCaptureTop.addEventListener("click", function () {
    var a = currentAngle();
    if (a === null || !isFinite(a)) return;
    capturedTop = a;
    el.capturedTopDisplay.textContent = a.toFixed(1) + "°";
    updateComputeButtonState();
  });

  function updateComputeButtonState() {
    var haveAngles = capturedBase !== null && capturedTop !== null;
    el.btnCompute.disabled = !haveAngles;
  }

  // ---- 計算樹高(核心公式) ----
  var TAN_EPSILON = 0.02; // 對應約 1.1 度,避免除以接近 0 的 tan(θ_base)

  function computeHeight() {
    showMsg(el.computeError, "");
    el.resultBox.style.display = "none";

    if (capturedBase === null || capturedTop === null) {
      showMsg(el.computeError, "請先擷取樹基與樹頂角度。");
      return;
    }

    var thetaBase = capturedBase;
    var thetaTop = capturedTop;
    var thetaBaseRad = deg2rad(thetaBase);
    var thetaTopRad = deg2rad(thetaTop);
    var tanBase = Math.tan(thetaBaseRad);
    var tanTop = Math.tan(thetaTopRad);

    var isModeE = el.modeE.checked;
    var H, D;

    if (isModeE) {
      var h = parseFloat(el.inputH.value);
      if (!isFinite(h) || h <= 0) {
        showMsg(el.computeError, "請輸入有效的眼睛/手機離地高度 h(公尺,大於 0)。");
        return;
      }
      if (thetaBase >= 0) {
        showMsg(
          el.computeError,
          "模式 E 需要看得到樹基,且樹基必須在水平線下方(樹基角度需為負值)。目前擷取到的樹基角度為 " +
            thetaBase.toFixed(1) +
            "°,請重新對準樹基後再擷取。"
        );
        return;
      }
      if (Math.abs(tanBase) < TAN_EPSILON) {
        showMsg(el.computeError, "俯角太小,請靠近一點或確認有對準樹基,再重新擷取樹基角度。");
        return;
      }
      // D = -h / tan(θ_base)
      D = -h / tanBase;
      // H = h + D * tan(θ_top)
      H = h + D * tanTop;
    } else {
      var d = parseFloat(el.inputD.value);
      if (!isFinite(d) || d <= 0) {
        showMsg(el.computeError, "請輸入有效的水平距離 D(公尺,大於 0)。");
        return;
      }
      D = d;
      // H = D * (tan(θ_top) - tan(θ_base)),對正負角度皆通用
      H = D * (tanTop - tanBase);
    }

    if (!isFinite(H) || !isFinite(D)) {
      showMsg(el.computeError, "計算結果不穩定(角度太接近垂直或輸入異常),請重新擷取角度或確認輸入。");
      return;
    }

    el.resultH.textContent = H.toFixed(1) + " m";
    el.resultD.textContent = "推算水平距離 D ≈ " + D.toFixed(1) + " m";
    el.resultAngles.textContent =
      "樹基角度 " + thetaBase.toFixed(1) + "°,樹頂角度 " + thetaTop.toFixed(1) + "°";
    el.resultBox.style.display = "block";
  }

  el.btnCompute.addEventListener("click", computeHeight);

  // ---- 重設 ----
  el.btnReset.addEventListener("click", function () {
    capturedBase = null;
    capturedTop = null;
    el.capturedBaseDisplay.textContent = "未擷取";
    el.capturedTopDisplay.textContent = "未擷取";
    el.resultBox.style.display = "none";
    showMsg(el.computeError, "");
    updateComputeButtonState();
  });

  // ---- 相機取景(可選,失敗自動退回純角度模式) ----
  el.btnCamera.addEventListener("click", function () {
    if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
      showMsg(el.cameraMsg, "此瀏覽器不支援相機取景,已使用純角度瞄準模式(沿手機頂邊瞄準即可)。");
      el.btnCamera.disabled = true;
      return;
    }
    navigator.mediaDevices
      .getUserMedia({ video: { facingMode: "environment" }, audio: false })
      .then(function (stream) {
        el.cameraVideo.srcObject = stream;
        el.cameraWrap.style.display = "block";
        el.btnCamera.style.display = "none";
        showMsg(el.cameraMsg, "");
      })
      .catch(function () {
        showMsg(el.cameraMsg, "相機無法使用或權限被拒,已退回純角度瞄準模式(沿手機頂邊瞄準即可)。");
        el.btnCamera.disabled = true;
      });
  });

  // ---- 初始狀態 ----
  updateModeUI();
  updateComputeButtonState();
  updateCaptureButtonsState();
})();
</script>
</body>
</html>
